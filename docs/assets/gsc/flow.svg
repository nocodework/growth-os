<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fd43be"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="growth-osFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2a2440"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="260" rx="16" fill="#f4f5f6"/>

  <!-- Source: Google Search Console -->
  <g>
    <rect x="40" y="86" width="200" height="88" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="40" y="86" width="6" height="88" rx="3" fill="url(#accent)"/>
    <text x="140" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">Google</text>
    <text x="140" y="144" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">Search Console</text>
    <text x="140" y="205" text-anchor="middle" font-size="12" fill="#7c3aed">data source</text>
  </g>

  <!-- Growth OS core -->
  <g>
    <rect x="350" y="72" width="200" height="116" rx="16" fill="url(#growth-osFill)"/>
    <text x="450" y="120" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Growth OS</text>
    <text x="450" y="146" text-anchor="middle" font-size="12" fill="#fd43be">Growth OS</text>
    <text x="450" y="215" text-anchor="middle" font-size="12" fill="#7c3aed">reads &amp; normalizes</text>
  </g>

  <!-- Output: Growth audit -->
  <g>
    <rect x="660" y="86" width="200" height="88" rx="14" fill="#ffffff" stroke="#fd43be" stroke-width="1.2"/>
    <rect x="854" y="86" width="6" height="88" rx="3" fill="url(#accent)"/>
    <text x="760" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a2e">Growth audit</text>
    <text x="760" y="144" text-anchor="middle" font-size="12" fill="#2a2440">SEO · queries · CTR</text>
    <text x="760" y="205" text-anchor="middle" font-size="12" fill="#7c3aed">LIVE baseline</text>
  </g>

  <!-- Arrows -->
  <line x1="240" y1="130" x2="344" y2="130" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="130" x2="654" y2="130" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
