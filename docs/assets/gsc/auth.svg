<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fd43be"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fd43be"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="300" rx="16" fill="#1a1a2e"/>
  <text x="40" y="52" font-size="18" font-weight="700" fill="#ffffff">How Growth OS gets read access</text>
  <text x="40" y="76" font-size="13" fill="#fd43be">One service account. Read-only. Your key, your cloud project.</text>

  <!-- Step 1 -->
  <g>
    <rect x="40" y="108" width="180" height="130" rx="14" fill="#2a2440" stroke="#7c3aed" stroke-width="1"/>
    <circle cx="66" cy="136" r="14" fill="url(#accent2)"/>
    <text x="66" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="60" y="176" font-size="13" font-weight="600" fill="#ffffff">Verify property</text>
    <text x="60" y="198" font-size="11" fill="#f4f5f6">in Search Console</text>
    <text x="60" y="216" font-size="11" fill="#f4f5f6">(DNS or HTML tag)</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="250" y="108" width="180" height="130" rx="14" fill="#2a2440" stroke="#7c3aed" stroke-width="1"/>
    <circle cx="276" cy="136" r="14" fill="url(#accent2)"/>
    <text x="276" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
    <text x="270" y="176" font-size="13" font-weight="600" fill="#ffffff">Enable API</text>
    <text x="270" y="198" font-size="11" fill="#f4f5f6">Search Console API</text>
    <text x="270" y="216" font-size="11" fill="#f4f5f6">in Google Cloud</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="460" y="108" width="180" height="130" rx="14" fill="#2a2440" stroke="#7c3aed" stroke-width="1"/>
    <circle cx="486" cy="136" r="14" fill="url(#accent2)"/>
    <text x="486" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <text x="480" y="176" font-size="13" font-weight="600" fill="#ffffff">Add SA as user</text>
    <text x="480" y="198" font-size="11" fill="#f4f5f6">the service account</text>
    <text x="480" y="216" font-size="11" fill="#f4f5f6">email, Full role</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="670" y="108" width="190" height="130" rx="14" fill="#7c3aed"/>
    <circle cx="696" cy="136" r="14" fill="#ffffff"/>
    <text x="696" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">4</text>
    <text x="690" y="176" font-size="13" font-weight="600" fill="#ffffff">Point .env</text>
    <text x="690" y="198" font-size="11" fill="#f4f5f6">to the JSON key,</text>
    <text x="690" y="216" font-size="11" fill="#f4f5f6">then verify</text>
  </g>

  <!-- Arrows -->
  <line x1="220" y1="173" x2="246" y2="173" stroke="#fd43be" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="430" y1="173" x2="456" y2="173" stroke="#fd43be" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="640" y1="173" x2="666" y2="173" stroke="#fd43be" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="40" y="278" font-size="11" fill="#7c3aed">Same service account you use for GA4 — reuse it, don't create a second one.</text>
</svg>
