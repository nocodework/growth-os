<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fd43be"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="growth-osFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="300" rx="16" fill="#f4f5f6"/>

  <!-- Source: Meta + Instagram -->
  <g>
    <rect x="34" y="86" width="196" height="128" rx="14" fill="#ffffff" stroke="url(#accent)" stroke-width="1.5"/>
    <rect x="34" y="86" width="196" height="34" rx="14" fill="url(#accent)"/>
    <rect x="34" y="104" width="196" height="16" fill="url(#accent)"/>
    <text x="132" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Meta + Instagram</text>
    <text x="132" y="146" text-anchor="middle" font-size="12.5" fill="#1a1a2e">Graph / Marketing API</text>
    <text x="132" y="168" text-anchor="middle" font-size="12" fill="#2a2440">campaigns · spend</text>
    <text x="132" y="186" text-anchor="middle" font-size="12" fill="#2a2440">ROAS · IG profile</text>
    <text x="132" y="204" text-anchor="middle" font-size="12" fill="#2a2440">followers · reach</text>
  </g>

  <line x1="234" y1="150" x2="322" y2="150" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Growth OS core -->
  <g>
    <rect x="330" y="72" width="200" height="156" rx="16" fill="url(#growth-osFill)"/>
    <circle cx="430" cy="118" r="20" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="430" cy="118" r="7" fill="url(#accent)"/>
    <text x="430" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Growth OS</text>
    <text x="430" y="192" text-anchor="middle" font-size="12" fill="#fd43be">read-side adapter</text>
    <text x="430" y="210" text-anchor="middle" font-size="11.5" fill="#f4f5f6">normalize · cache · score</text>
  </g>

  <line x1="534" y1="150" x2="622" y2="150" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Audit output -->
  <g>
    <rect x="630" y="86" width="196" height="128" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="728" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2440">Growth audit</text>
    <text x="728" y="148" text-anchor="middle" font-size="12" fill="#1a1a2e">paid-channel baseline</text>
    <text x="728" y="168" text-anchor="middle" font-size="12" fill="#1a1a2e">ROAS &amp; spend trend</text>
    <text x="728" y="188" text-anchor="middle" font-size="12" fill="#1a1a2e">social presence check</text>
  </g>

  <text x="430" y="270" text-anchor="middle" font-size="12.5" fill="#7c3aed">Read-only. Growth OS never writes to your ad account.</text>
</svg>
