<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Growth OS — data sources flow into a gate that drives a growth loop">
  <title>Growth OS — the open-source Growth OS</title>
  <desc>Six data sources (GA4, Search Console, Google Ads, Meta / Instagram, MailerLite, your site) flow into the Growth OS gate, which powers a growth loop of audit, context and act.</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fd43be"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="brand-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fd43be"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fd43be"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f63"/>
      <stop offset="1" stop-color="#2a2440"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fd43be"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fd43be" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <!-- ===== title block ===== -->
  <g transform="translate(486,50) scale(0.1875)">
    <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#tile)"/>
    <path d="M87 178 L87 110 A41 41 0 0 1 169 110 L169 178" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 202 L182 202" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  </g>
  <text x="550" y="90" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="50" font-weight="800" letter-spacing="-1" fill="url(#brand)">Growth OS</text>
  <text x="600" y="126" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="500" fill="#55506a">The open-source Growth OS for any AI agent.</text>

  <!-- ===== glow behind gate ===== -->
  <circle cx="600" cy="395" r="185" fill="url(#glow)"/>

  <!-- ===== section captions ===== -->
  <text x="151" y="168" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#9a94ad">YOUR DATA</text>
  <text x="980" y="242" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#9a94ad">GROWTH LOOP</text>

  <!-- ===== flow lines (sources -> gate) ===== -->
  <g fill="none" stroke="url(#flow)" stroke-width="2.5" opacity="0.55">
    <path d="M246 210 C400 210 484 395 556 395"/>
    <path d="M246 284 C400 284 486 395 556 395"/>
    <path d="M246 358 C420 358 500 395 556 395"/>
    <path d="M246 432 C420 432 500 395 556 395"/>
    <path d="M246 506 C400 506 486 395 556 395"/>
    <path d="M246 580 C400 580 484 395 556 395"/>
  </g>
  <!-- flow origin dots -->
  <g>
    <circle cx="246" cy="210" r="3.5" fill="#ffd400"/>
    <circle cx="246" cy="284" r="3.5" fill="#3b82f6"/>
    <circle cx="246" cy="358" r="3.5" fill="#16863d"/>
    <circle cx="246" cy="432" r="3.5" fill="#fd43be"/>
    <circle cx="246" cy="506" r="3.5" fill="#7c3aed"/>
    <circle cx="246" cy="580" r="3.5" fill="#1a1a2e"/>
  </g>

  <!-- ===== source cards ===== -->
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1a1a2e">
    <g>
      <rect x="56" y="181" width="190" height="58" rx="14" fill="#ffffff" stroke="#e7e3ee" stroke-width="1"/>
      <circle cx="82" cy="210" r="6" fill="#ffd400"/>
      <text x="100" y="215">GA4</text>
    </g>
    <g>
      <rect x="56" y="255" width="190" height="58" rx="14" fill="#ffffff" stroke="#e7e3ee" stroke-width="1"/>
      <circle cx="82" cy="284" r="6" fill="#3b82f6"/>
      <text x="100" y="289">Search Console</text>
    </g>
    <g>
      <rect x="56" y="329" width="190" height="58" rx="14" fill="#ffffff" stroke="#e7e3ee" stroke-width="1"/>
      <circle cx="82" cy="358" r="6" fill="#16863d"/>
      <text x="100" y="363">Google Ads</text>
    </g>
    <g>
      <rect x="56" y="403" width="190" height="58" rx="14" fill="#ffffff" stroke="#e7e3ee" stroke-width="1"/>
      <circle cx="82" cy="432" r="6" fill="#fd43be"/>
      <text x="100" y="437">Meta / Instagram</text>
    </g>
    <g>
      <rect x="56" y="477" width="190" height="58" rx="14" fill="#ffffff" stroke="#e7e3ee" stroke-width="1"/>
      <circle cx="82" cy="506" r="6" fill="#7c3aed"/>
      <text x="100" y="511">MailerLite</text>
    </g>
    <g>
      <rect x="56" y="551" width="190" height="58" rx="14" fill="#ffffff" stroke="#e7e3ee" stroke-width="1"/>
      <circle cx="82" cy="580" r="6" fill="#1a1a2e"/>
      <text x="100" y="585">Your site</text>
    </g>
  </g>

  <!-- ===== the Growth OS gate ===== -->
  <g>
    <!-- dock base -->
    <rect x="546" y="545" width="168" height="16" rx="7" fill="url(#gate)"/>
    <!-- portal outer -->
    <path d="M556 545 L556 340 A74 74 0 0 1 704 340 L704 545 Z" fill="url(#gate)"/>
    <!-- portal opening -->
    <path d="M576 545 L576 352 A54 54 0 0 1 684 352 L684 545 Z" fill="#f4f5f6"/>
    <!-- keystone accents on the arch -->
    <rect x="562" y="286" width="15" height="16" rx="4" fill="url(#brand-v)" opacity="0.9"/>
    <rect x="592" y="270" width="16" height="18" rx="4" fill="url(#brand-v)"/>
    <rect x="622" y="255" width="16" height="20" rx="4" fill="url(#brand-v)"/>
    <rect x="652" y="270" width="16" height="18" rx="4" fill="url(#brand-v)"/>
    <rect x="683" y="286" width="15" height="16" rx="4" fill="url(#brand-v)" opacity="0.9"/>
    <text x="630" y="452" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0.5" fill="#8a84a0">context</text>
    <text x="630" y="472" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0.5" fill="#8a84a0">hub</text>
  </g>

  <!-- gate -> loop connector -->
  <path d="M714 395 L860 395" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arw)"/>

  <!-- ===== growth loop ===== -->
  <g fill="none" stroke="#7c3aed" stroke-width="3">
    <path d="M1008.9 294.1 A105 105 0 0 1 1081.9 420.4" marker-end="url(#arw)"/>
    <path d="M1052.9 470.5 A105 105 0 0 1 907.1 470.5" marker-end="url(#arw)"/>
    <path d="M878.1 420.4 A105 105 0 0 1 951.1 294.1" marker-end="url(#arw)"/>
  </g>

  <!-- loop centre label -->
  <text x="980" y="392" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#9a94ad">compound</text>
  <text x="980" y="408" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#9a94ad">growth</text>

  <!-- loop nodes -->
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g>
      <rect x="941" y="273" width="78" height="34" rx="17" fill="url(#brand)"/>
      <text x="980" y="295" fill="#ffffff">Audit</text>
    </g>
    <g>
      <rect x="1021" y="430.5" width="100" height="34" rx="17" fill="#2a2440"/>
      <text x="1071" y="452.5" fill="#ffffff">Context</text>
    </g>
    <g>
      <rect x="853" y="430.5" width="72" height="34" rx="17" fill="#2a2440"/>
      <text x="889" y="452.5" fill="#ffffff">Act</text>
    </g>
  </g>
</svg>
