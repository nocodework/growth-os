<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="pf-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fd43be"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pf-growth-os" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="pf-arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="280" rx="16" fill="#f4f5f6"/>

  <!-- Stage labels -->
  <text x="140" y="44" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#7c3aed" font-weight="600">SOURCE</text>
  <text x="450" y="44" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#7c3aed" font-weight="600">GROWTH OS</text>
  <text x="770" y="44" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#7c3aed" font-weight="600">AUDIT</text>

  <!-- Source: MailerLite -->
  <rect x="40" y="72" width="200" height="136" rx="14" fill="#ffffff" stroke="#e4d9f5" stroke-width="1.4"/>
  <rect x="40" y="72" width="6" height="136" rx="3" fill="url(#pf-accent)"/>
  <text x="140" y="112" text-anchor="middle" font-size="17" fill="#1a1a2e" font-weight="700">MailerLite</text>
  <text x="140" y="140" text-anchor="middle" font-size="12.5" fill="#6b6a7c">Subscribers</text>
  <text x="140" y="160" text-anchor="middle" font-size="12.5" fill="#6b6a7c">Lists &amp; groups</text>
  <text x="140" y="180" text-anchor="middle" font-size="12.5" fill="#6b6a7c">Campaign stats</text>

  <!-- Arrow source -> growth-os -->
  <line x1="248" y1="140" x2="342" y2="140" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#pf-arrow)"/>
  <text x="295" y="128" text-anchor="middle" font-size="10.5" fill="#8a89a0">read-only</text>

  <!-- Growth OS core -->
  <rect x="350" y="72" width="200" height="136" rx="14" fill="url(#pf-growth-os)"/>
  <circle cx="450" cy="118" r="20" fill="none" stroke="url(#pf-accent)" stroke-width="2.4"/>
  <circle cx="450" cy="118" r="7" fill="url(#pf-accent)"/>
  <text x="450" y="164" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700">Growth OS</text>
  <text x="450" y="186" text-anchor="middle" font-size="11.5" fill="#b9b4d4">adapter → context</text>

  <!-- Arrow growth-os -> audit -->
  <line x1="558" y1="140" x2="652" y2="140" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#pf-arrow)"/>

  <!-- Audit outputs -->
  <rect x="660" y="72" width="200" height="136" rx="14" fill="#ffffff" stroke="#e4d9f5" stroke-width="1.4"/>
  <rect x="660" y="72" width="6" height="136" rx="3" fill="url(#pf-accent)"/>
  <text x="760" y="110" text-anchor="middle" font-size="15" fill="#1a1a2e" font-weight="700">Growth audit</text>
  <text x="760" y="138" text-anchor="middle" font-size="12.5" fill="#6b6a7c">List health</text>
  <text x="760" y="158" text-anchor="middle" font-size="12.5" fill="#6b6a7c">Open / click rates</text>
  <text x="760" y="178" text-anchor="middle" font-size="12.5" fill="#6b6a7c">Lifecycle signals</text>

  <text x="450" y="248" text-anchor="middle" font-size="12" fill="#8a89a0">Growth OS reads MailerLite once, folds it into your context, and reports back. Nothing is written to your account.</text>
</svg>
