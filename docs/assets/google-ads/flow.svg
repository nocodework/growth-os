<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-label="Google Ads data flows into Growth OS, which feeds the growth audit">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fd43be"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="growth-osFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="280" rx="16" fill="#f4f5f6"/>

  <!-- Source: Google Ads -->
  <g>
    <rect x="40" y="96" width="200" height="88" rx="14" fill="#ffffff" stroke="#e2e0ec" stroke-width="1.5"/>
    <rect x="40" y="96" width="6" height="88" rx="3" fill="url(#accent)"/>
    <text x="66" y="128" font-size="15" font-weight="600" fill="#1a1a2e">Google Ads</text>
    <text x="66" y="150" font-size="12" fill="#6b6880">Campaigns · spend</text>
    <text x="66" y="168" font-size="12" fill="#6b6880">CPA · ROAS</text>
    <text x="66" y="86" font-size="11" font-weight="600" fill="#7c3aed" letter-spacing="0.6">DATA SOURCE</text>
  </g>

  <!-- Arrow 1 -->
  <g stroke="url(#accent)" stroke-width="2.5" fill="none">
    <line x1="248" y1="140" x2="332" y2="140"/>
    <path d="M332 140 l-11 -6 v12 z" fill="#7c3aed" stroke="none"/>
  </g>
  <text x="290" y="128" font-size="11" fill="#6b6880" text-anchor="middle">read-only</text>

  <!-- Growth OS core -->
  <g>
    <rect x="342" y="80" width="216" height="120" rx="16" fill="url(#growth-osFill)"/>
    <rect x="342" y="80" width="216" height="120" rx="16" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="378" cy="118" r="9" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="378" cy="118" r="3" fill="#fd43be"/>
    <text x="398" y="123" font-size="17" font-weight="700" fill="#ffffff">Growth OS</text>
    <text x="366" y="152" font-size="12" fill="#c9c4dd">Normalize · store to</text>
    <text x="366" y="172" font-size="12" fill="#fd43be" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">.agents/product-marketing.md</text>
  </g>

  <!-- Arrow 2 -->
  <g stroke="url(#accent)" stroke-width="2.5" fill="none">
    <line x1="566" y1="140" x2="650" y2="140"/>
    <path d="M650 140 l-11 -6 v12 z" fill="#7c3aed" stroke="none"/>
  </g>

  <!-- Audit output -->
  <g>
    <rect x="660" y="96" width="200" height="88" rx="14" fill="#ffffff" stroke="#e2e0ec" stroke-width="1.5"/>
    <rect x="660" y="96" width="6" height="88" rx="3" fill="url(#accent)"/>
    <text x="686" y="128" font-size="15" font-weight="600" fill="#1a1a2e">Growth audit</text>
    <text x="686" y="150" font-size="12" fill="#6b6880">SEO · speed · GEO</text>
    <text x="686" y="168" font-size="12" fill="#6b6880">paid baseline</text>
    <text x="686" y="86" font-size="11" font-weight="600" fill="#7c3aed" letter-spacing="0.6">OUTPUT</text>
  </g>

  <text x="450" y="248" font-size="12" fill="#6b6880" text-anchor="middle">Your keys, your data — Growth OS only reads. Nothing is written back to Google Ads.</text>
</svg>
